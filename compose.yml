services:
  tmdb-stremio-addon:
    image: tmdb-stremio-addon:latest
    container_name: tmdb-stremio-addon
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in your environment or .env file}
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_URL: ${PUBLIC_URL:-}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
    volumes:
      - tmdb-stremio-addon-cache:/app/cache

volumes:
  tmdb-stremio-addon-cache:
